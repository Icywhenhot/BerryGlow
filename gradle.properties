# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.9
loader_version=0.19.2
loom_version=1.16.2

# Mod Properties
mod_version=1.1.1
maven_group=com.berryglow

# Dependencies
# Built against the 1.21.9 floor so the mixin refmap is anchored to the lowest
# supported version; the intermediary names are stable up through 1.21.10, so a
# single jar covers the whole 1.21.9-1.21.10 range.
fabric_api_version=0.134.0+1.21.9
modmenu_version=16.0.1

